<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Order Confirmed — GRUBZ</title>
  <meta name="robots" content="noindex" />
  <link rel="apple-touch-icon" sizes="180x180" href="/images/favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon/favicon-16x16.png">
  <link rel="manifest" href="/images/favicon/site.webmanifest">
  <link rel="stylesheet" href="/styles/tailwind.css">
  <style>
    :root{
      --grubz-1:#d04211; /* primary */
      --grubz-2:#e37500; /* accent */
      --grubz-3:#daa266; /* sand */
      --grubz-4:#71391d; /* dark */
      --positive:#2f7d52;
      --positive-hover:#256643;
    }
    .bg-grubz{ background: linear-gradient(135deg,var(--grubz-1),var(--grubz-2)); }
    .btn{ background: var(--positive); color:#fff; border-radius:.75rem; padding:.8rem 1.1rem; font-weight:700; }
    .btn:hover{ background:var(--positive-hover) }
    .btn-outline{ border:2px solid var(--grubz-1); color:var(--grubz-1); background:#fff; border-radius:.75rem; padding:.8rem 1.1rem; font-weight:700; }
  </style>

  <!-- ADDED: Firebase (compat) for Auth so we can attach the ID token to verifyCheckout -->
  <script src="/__/firebase/12.2.1/firebase-app-compat.js"></script>
  <script src="/__/firebase/12.2.1/firebase-auth-compat.js"></script>
  <script src="/__/firebase/init.js"></script>
  <script>
    (function initFirebase() {
      if (!window.firebase) return;
      if (!firebase.apps.length && window.GRUBZ_FIREBASE_CONFIG) {
        firebase.initializeApp(window.GRUBZ_FIREBASE_CONFIG);
      }
    })();
  </script>
</head>
<body class="antialiased text-zinc-800">

  <!-- Top bar -->
  <header class="sticky top-0 z-50 bg-white/90 backdrop-blur border-b border-zinc-200">
      <!-- top ribbon -->
      <div class="bg-grubz text-white">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 py-2 text-sm flex items-center justify-between">
          <div class="inline-flex items-center gap-2">
            <img src="../../images/greece-flag-40.png" class="h-3.5" alt="GR flag" />
            <span data-i18n="madeInGr">Made in Greece</span>
          </div>

          <!-- language + cart -->
          <div class="flex items-center gap-2">
            <button id="lang-en" class="px-2 py-1 rounded chip">EN</button>
            <button id="lang-el" class="px-2 py-1 rounded chip">ΕΛ</button>
          </div>
        </div>
      </div>

      <!-- main nav -->
      <div class="max-w-6xl mx-auto px-4 sm:px-6 py-3 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <img src="../../images/grubz-icon-80.png" alt="GRUBZ icon" class="h-14 w-14"/>
          <span class="text-2xl font-extrabold tracking-tight" style="color:var(--grubz-4)">GRUBZ</span>
        </div>
      </div>
    </header>

  <!-- Content -->
  <main class="max-w-3xl mx-auto px-4 py-14">
    <div class="text-center">
      <svg xmlns="http://www.w3.org/2000/svg" class="mx-auto mb-5" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="color:var(--grubz-1)">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
      <h1 class="text-3xl font-extrabold mb-2" data-i18n="title">Payment successful</h1>
      <p class="text-zinc-600" data-i18n="subtitle">Thanks for your order! We’re getting it ready.</p>

      <div class="mt-6 inline-flex items-center gap-2 px-3 py-2 rounded-lg bg-zinc-100 text-sm">
        <span id="referenceLabel" class="text-zinc-500" data-i18n="orderLabel">Order number:</span>
        <code id="sid" class="font-mono text-zinc-800"></code>
      </div>

      <div class="mt-10 flex flex-wrap justify-center gap-3">
        <a href="/#products" class="btn" data-i18n="back">Back to shop</a>
        <a href="mailto:info@grubz.gr" class="btn-outline" data-i18n="support">Contact support</a>
      </div>

      <p class="mt-6 text-xs text-zinc-500" data-i18n="note">
        If email receipts are enabled, you’ll receive one shortly.
      </p>

      <section class="mx-auto mt-8 max-w-xl rounded-2xl border border-orange-100 bg-orange-50 p-5 text-left" aria-labelledby="newsletterTitle">
        <h2 id="newsletterTitle" class="text-lg font-extrabold" style="color:var(--grubz-4)" data-i18n="newsletterTitle">Keep learning with GRUBZ</h2>
        <p class="mt-1 text-sm text-zinc-600" data-i18n="newsletterText">Get practical feeding tips, product news, and occasional offers.</p>
        <form id="successNewsletterForm" class="mt-4 space-y-3">
          <label class="block">
            <span class="sr-only" data-i18n="newsletterEmail">Email address</span>
            <input id="successNewsletterEmail" class="w-full rounded-xl border border-zinc-300 bg-white px-3 py-2" type="email" autocomplete="email" required placeholder="you@example.com">
          </label>
          <label class="flex items-start gap-2 text-xs text-zinc-600">
            <input id="successNewsletterConsent" class="mt-0.5 h-4 w-4 shrink-0" type="checkbox" required>
            <span data-i18n="newsletterConsent">I agree to receive GRUBZ marketing emails. I can unsubscribe at any time.</span>
          </label>
          <button id="successNewsletterSubmit" class="btn w-full" type="submit" data-i18n="newsletterSubscribe">Join the newsletter</button>
          <p id="successNewsletterMsg" class="text-sm" role="status" aria-live="polite"></p>
        </form>
      </section>
    </div>
  </main>

  <script>
    // --- i18n ---
    const i18n = {
      en: {
        title: "Payment successful",
        codTitle: "Order confirmed",
        quoteTitle: "Shipping quote requested",
        subtitle: "Thanks for your order! We’re getting it ready.",
        codSubtitle: "Thanks for your order! You selected cash on delivery.",
        quoteSubtitle: "Your order has not been charged. We will email you the courier price and estimated delivery time before payment.",
        orderLabel: "Order number:",
        orderLoading: "Loading...",
        back: "Back to shop",
        support: "Contact support",
        note: "If email receipts are enabled, you’ll receive one shortly.",
        newsletterTitle: "Keep learning with GRUBZ",
        newsletterText: "Get practical feeding tips, product news, and occasional offers.",
        newsletterEmail: "Email address",
        newsletterConsent: "I agree to receive GRUBZ marketing emails. I can unsubscribe at any time.",
        newsletterSubscribe: "Join the newsletter",
        newsletterSending: "Subscribing...",
        newsletterSuccess: "You’re subscribed. Welcome to the GRUBZ newsletter!",
        newsletterError: "Subscription failed. Please try again.",
        madeInGr: "Made in Greece"
      },
      el: {
        title: "Η πληρωμή ολοκληρώθηκε",
        codTitle: "Η παραγγελία επιβεβαιώθηκε",
        quoteTitle: "Το αίτημα προσφοράς καταχωρίστηκε",
        subtitle: "Ευχαριστούμε για την παραγγελία! Τη προετοιμάζουμε.",
        codSubtitle: "Ευχαριστούμε για την παραγγελία! Επιλέξατε αντικαταβολή.",
        quoteSubtitle: "Δεν έχει γίνει χρέωση. Θα σας στείλουμε με email το κόστος courier και τον εκτιμώμενο χρόνο παράδοσης πριν από την πληρωμή.",
        orderLabel: "Αριθμός παραγγελίας:",
        orderLoading: "Φόρτωση...",
        back: "Επιστροφή στο κατάστημα",
        support: "Υποστήριξη",
        note: "Αν οι αποδείξεις email είναι ενεργές, θα τη λάβετε σύντομα.",
        newsletterTitle: "Συνέχισε να μαθαίνεις με το GRUBZ",
        newsletterText: "Λάβε πρακτικές συμβουλές διατροφής, νέα προϊόντων και περιστασιακές προσφορές.",
        newsletterEmail: "Διεύθυνση email",
        newsletterConsent: "Συμφωνώ να λαμβάνω προωθητικά email από το GRUBZ. Μπορώ να διαγραφώ ανά πάσα στιγμή.",
        newsletterSubscribe: "Εγγραφή στο newsletter",
        newsletterSending: "Γίνεται εγγραφή...",
        newsletterSuccess: "Η εγγραφή ολοκληρώθηκε. Καλώς ήρθες στο newsletter του GRUBZ!",
        newsletterError: "Η εγγραφή απέτυχε. Δοκίμασε ξανά.",
        madeInGr: "Παράγεται στην Ελλάδα"
      }
    };
    const $$ = s=>document.querySelectorAll(s);
    function applyLang(lang){
      const t = i18n[lang] || i18n.en;
      $$("[data-i18n]").forEach(el => {
        const key = el.getAttribute("data-i18n");
        if (t[key]) el.textContent = t[key];
      });
      localStorage.setItem("grubz_lang", lang);
      document.documentElement.lang = (lang === "el" ? "el" : "en");
    }
    const saved = localStorage.getItem("grubz_lang") || (navigator.language.startsWith("el") ? "el" : "en");
    applyLang(saved);
    document.getElementById("lang-en").onclick = () => applyLang("en");
    document.getElementById("lang-el").onclick = () => applyLang("el");

    // --- Helpers for clearing cart via backend verification ---
    const LOCAL_HOSTS = new Set(["localhost", "127.0.0.1"]);
    const API_BASE = LOCAL_HOSTS.has(location.hostname)
      ? "http://127.0.0.1:5101/grubz-99b84/europe-west1"
      : "https://europe-west1-grubz-99b84.cloudfunctions.net";
    const NEWSLETTER_API_BASE = ["localhost", "127.0.0.1"].includes(location.hostname) && location.port === "5100"
      ? "/api"
      : API_BASE;
    let __user = null;

    function removeCookie(name){
      document.cookie = `${name}=; Expires=Thu, 01 Jan 1970 00:00:00 GMT; Path=/; SameSite=Lax${location.protocol==='https:'?'; Secure':''}`;
    }

    const META_PIXEL_ID = "2792868587751630";
    function metaPurchase(data, sid){
      let consent = null;
      try {
        const raw = document.cookie.split('; ').find(row => row.startsWith('grubz_consent='));
        consent = raw ? JSON.parse(decodeURIComponent(raw.split('=').slice(1).join('='))) : null;
      } catch {}
      if (!consent?.marketing || !data?.paid) return;
      const dedupeKey = `grubz_meta_purchase_${sid}`;
      if (localStorage.getItem(dedupeKey)) return;
      !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
      n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}
      (window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
      fbq('init', META_PIXEL_ID);
      fbq('track', 'Purchase', {
        value: Number(data.amount_total || 0) / 100,
        currency: String(data.currency || 'EUR').toUpperCase(),
      });
      localStorage.setItem(dedupeKey, new Date().toISOString());
    }

    async function waitForAuthInit(timeout = 4000){
      return new Promise(resolve => {
        let settled = false;
        const t = setTimeout(() => { if (!settled) { settled = true; resolve(); } }, timeout);
        firebase.auth().onAuthStateChanged(u => {
          __user = u || null;
          if (!settled) { settled = true; clearTimeout(t); resolve(); }
        });
      });
    }

    async function authedFetch(path, options = {}){
      const headers = Object.assign({ "Content-Type": "application/json" }, options.headers || {});
      if (__user) {
        try {
          const tok = await __user.getIdToken(/*force*/ true);
          headers.Authorization = "Bearer " + tok;
        } catch {}
      }
      return fetch(`${API_BASE}${path}`, { ...options, headers, mode: "cors" });
    }

    async function maybeClearCartOnSuccess(){
      // Support both ?sid=... and Stripe's ?session_id=...
      const qs = new URLSearchParams(location.search);
      const cod = qs.get("cod") === "1";
      const quote = qs.get("quote") === "1";
      const orderNumber = qs.get("order") || "";
      if (cod || quote) {
        const lang = localStorage.getItem("grubz_lang") || "en";
        const t = i18n[lang] || i18n.en;
        const title = document.querySelector("[data-i18n='title']");
        const subtitle = document.querySelector("[data-i18n='subtitle']");
        const label = document.getElementById("referenceLabel");
        const sidEl = document.getElementById("sid");
        if (title) {
          title.setAttribute("data-i18n", quote ? "quoteTitle" : "codTitle");
          title.textContent = quote ? t.quoteTitle : t.codTitle;
        }
        if (subtitle) {
          subtitle.setAttribute("data-i18n", quote ? "quoteSubtitle" : "codSubtitle");
          subtitle.textContent = quote ? t.quoteSubtitle : t.codSubtitle;
        }
        if (label) {
          label.setAttribute("data-i18n", "orderLabel");
          label.textContent = t.orderLabel;
        }
        if (sidEl) sidEl.textContent = orderNumber || "—";
        removeCookie("grubz_cart");
        try {
          const url = new URL(location.href);
          url.search = "";
          history.replaceState({}, "", url.toString());
        } catch {}
        return;
      }

      const sid = qs.get("sid") || qs.get("session_id");
      if (!sid) return;

      // Show the reference to the user
      const sidEl = document.getElementById("sid");
      if (sidEl) sidEl.textContent = sid;

      // Wait for Firebase auth to pick up the persisted session
      await waitForAuthInit();

      try {
        const resp = await authedFetch(`/verifyCheckout?sid=${encodeURIComponent(sid)}`, { method: "GET" });
        const data = await resp.json().catch(()=> ({}));

        if (resp.ok && data.paid) {
          metaPurchase(data, sid);
          if (data.orderNumber) {
            sidEl.textContent = data.orderNumber;
            const label = document.getElementById("referenceLabel");
            if (label) {
              label.setAttribute("data-i18n", "orderLabel");
              label.textContent = (i18n[localStorage.getItem("grubz_lang") || "en"] || i18n.en).orderLabel;
            }
          }
          // Clear the cart cookie set by the shop page
          removeCookie("grubz_cart");

          // Remove the query param so refreshes don't re-run the check
          try {
            const url = new URL(location.href);
            url.search = "";
            history.replaceState({}, "", url.toString());
          } catch {}
        } else {
          if (sidEl) sidEl.textContent = "—";
          console.warn("verifyCheckout not paid or failed:", data);
        }
      } catch (e) {
        if (sidEl) sidEl.textContent = "—";
        console.warn("verifyCheckout error:", e);
      }
    }

    // Never expose the Stripe session ID; show the order number after verification.
    const sidParam = new URLSearchParams(location.search).get("sid") || new URLSearchParams(location.search).get("session_id");
    document.getElementById("sid").textContent = sidParam
      ? (i18n[localStorage.getItem("grubz_lang") || "en"] || i18n.en).orderLoading
      : "—";

    // Kick off the clear-cart flow
    maybeClearCartOnSuccess();

    document.getElementById("successNewsletterEmail").value = localStorage.getItem("grubz_marketing_email") || "";
    document.getElementById("successNewsletterForm").addEventListener("submit", async event => {
      event.preventDefault();
      const form = event.currentTarget;
      if (!form.reportValidity()) return;
      const email = document.getElementById("successNewsletterEmail").value.trim().toLowerCase();
      const button = document.getElementById("successNewsletterSubmit");
      const message = document.getElementById("successNewsletterMsg");
      const language = localStorage.getItem("grubz_lang") === "el" ? "el" : "en";
      const text = i18n[language] || i18n.en;
      button.disabled = true;
      message.textContent = text.newsletterSending;
      try {
        const response = await fetch(`${NEWSLETTER_API_BASE}/newsletter`, {
          method:"POST",
          headers:{ "Content-Type":"application/json" },
          body:JSON.stringify({
            action:"subscribe",
            email,
            language,
            source:"checkout_success",
            consentText:text.newsletterConsent,
          }),
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok || data.ok !== true || data.status !== "subscribed") {
          throw new Error(data.error || data.message || text.newsletterError);
        }
        localStorage.setItem("grubz_marketing_email", email);
        message.className = "text-sm text-green-700";
        message.textContent = text.newsletterSuccess;
        form.querySelectorAll("input, button").forEach(control => control.disabled = true);
      } catch (error) {
        message.className = "text-sm text-red-600";
        message.textContent = error.message || text.newsletterError;
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
